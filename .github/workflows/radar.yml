name: Daily squeeze radar

# After each US trading day (FINRA posts short volume by ~6pm ET), run the radar scans, store the
# picks on the `radar` branch and grade picks old enough to know how they turned out.
on:
  schedule:
    - cron: "40 23 * * 1-5"
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    if: github.event_name != 'pull_request' || github.event.label.name == 'radar'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DISABLE_BACKGROUND_SCANNER: "1"
      PUMP_DATA_DIR: pump_data
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Fetch the trained pump model and the radar history
        run: |
          mkdir -p pump_data
          if git fetch --depth 1 origin pump-data; then git archive FETCH_HEAD | tar -x -C pump_data; fi
          if git ls-remote --exit-code origin radar >/dev/null; then
            git clone --quiet --branch radar --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" radar
          else
            mkdir radar && git -C radar init -q -b radar
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run today's scans
        run: uv run python -m pump_research radar run --dir radar
      - name: Grade past picks
        run: uv run python -m pump_research radar grade --dir radar | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish to the radar branch
        run: |
          cd radar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Radar $(date -u +%F) from ${GITHUB_SHA::7}" || exit 0
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:radar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
