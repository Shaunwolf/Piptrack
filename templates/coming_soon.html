{% extends "base.html" %}

{% block title %}{{ page_title }} - PipSqueak{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto text-center space-y-6 py-16">
    <div class="flex justify-center">
        <div class="w-16 h-16 bg-gradient-to-br from-blue-500 to-purple-600 rounded-full flex items-center justify-center shadow-2xl">
            <i class="fas fa-tools text-2xl text-white"></i>
        </div>
    </div>
    <h1 class="text-4xl font-bold">{{ page_title }}</h1>
    <p class="text-gray-400">{{ message }}</p>
    <a href="{{ url_for('index') }}" class="inline-block bg-dark-accent hover:bg-gray-600 text-white px-6 py-3 rounded-lg transition-colors">
        <i class="fas fa-home mr-2"></i>Back to Dashboard
    </a>
</div>
{% endblock %}
